name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run lint

  format:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run format:check
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run typecheck

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: caps
          POSTGRES_PASSWORD: caps
          POSTGRES_DB: caps_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caps -d caps_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-alpine
        env:
          # guest is loopback-only in RabbitMQ; use a dedicated user for the runner
          RABBITMQ_DEFAULT_USER: caps
          RABBITMQ_DEFAULT_PASS: caps
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://caps:caps@localhost:5432/caps_test
      DATABASE_URL_TEST: postgresql://caps:caps@localhost:5432/caps_test
      RABBITMQ_URL_TEST: amqp://caps:caps@localhost:5672
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run db:generate
      - name: Apply database migrations
        run: bunx prisma migrate deploy
      - name: Run tests with coverage
        run: bun run test:coverage
        timeout-minutes: 15
      - name: Coverage report
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
